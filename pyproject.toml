[project]
name = "autoservice"
version = "0.5.14"
description = "Офлайн-программа для небольшого автосервиса"
requires-python = ">=3.13,<3.15"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
